name: Review open pull requests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: review-open-prs
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      - run: bun run --cwd packages/script pr-review:select > ReviewSelections.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ReviewSelections
          path: ReviewSelections.json

  analyze:
    needs: select
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ReviewSelections
      - name: Produce draft-only reviews
        env:
          REVIEW_ANALYSIS_TOKEN: ${{ secrets.REVIEW_ANALYSIS_TOKEN }}
        run: bun run script/review-open-prs-analyze.ts ReviewSelections.json ReviewDrafts.json
      - run: bun run --cwd packages/script pr-review:post --validate ReviewDrafts.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ReviewDrafts
          path: ReviewDrafts.json

  post:
    needs: analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ReviewDrafts
      - name: Reselect, comment, and verify each draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run --cwd packages/script pr-review:post ReviewDrafts.json
